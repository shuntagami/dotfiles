# 処理用Mac：社内サービス（文字起こし・launch-video-gen・marunage-studio）を常駐させるMac。
# scripts/processing-mac.sh と deploy.sh が読む。手順は docs/processing-mac.md。
#
# PROCESSING_MAC
#   サービスを動かすMacの名前（`scutil --get LocalHostName` の値）。
#   このMacで deploy.sh を実行すると、まだ動いていないサービスを引き受ける。
# PREVIOUS_PROCESSING_MAC
#   新しいMacへ移すときだけ書く。今サービスが動いているMacへの SSH 先
#   （Tailscale の名前、または Thunderbolt Bridge でつないだときの IP）。
#   移し終えたら空に戻す。
PROCESSING_MAC=Shun-Tagami-Mac-Studio
PREVIOUS_PROCESSING_MAC=
