# 処理用Macのログと稼働確認を、Cloud Logging（GCP プロジェクト automatic-recording-of-minutes）へ送る。
# run-vector.sh が起動し、${…} の環境変数もそこで決める。動くのは ~/.local/state/processing-mac-logs/app に写したもの
# なので、書き換えたら processing-mac.sh deploy で写し直す（Vector も起動し直す）。
# 見方と通知の条件は ele-inc/elevenlabs-transcribe-bot の docs/MAC_SERVICE.md「ログと停止通知」。

data_dir: "${PROCESSING_MAC_LOGS_HOME}/data"

sources:
  service_logs:
    type: file
    include:
      - "${HOME}/Library/Logs/scribe-bot/*.log"
      - "${HOME}/Library/Logs/launch-video-gen/*.log"
      - "${HOME}/Library/Logs/marunage-studio/*.log"
    # 読んだ位置の記録が無いファイルを、先頭と末尾のどちらから読むか（run-vector.sh が決める）。
    # 動いている間にできたファイルは、いつも先頭から読む。
    # ファイルは1行目で見分けるので、ログを空にするときは1行目を前と違う行にする（scribe の auto-update.sh）。
    read_from: "${PROCESSING_MAC_LOGS_READ_FROM}"
    # スタックトレースのように空白で始まる行は、前の行とまとめて1件にする。
    multiline:
      start_pattern: '^\S'
      mode: continue_through
      condition_pattern: '^\s'
      timeout_ms: 1000

  heartbeat:
    type: exec
    mode: scheduled
    command: ["/bin/bash", "${PROCESSING_MAC_LOGS_DIR}/heartbeat.sh"]
    scheduled:
      exec_interval_secs: 60
    include_stderr: false
    decoding:
      codec: json

transforms:
  service_entries:
    type: remap
    inputs: [service_logs]
    source: |
      parts = split(string!(.file), "/")
      message = strip_ansi_escape_codes(string!(.message))
      # エラーや警告らしい行に重要度を付けて、Logs Explorer で絞り込めるようにする。
      # cloudflared の行（「時刻 INF/WRN/ERR …」）はその印に従い、ほかは言葉で見分ける（厳密ではない）。
      severity = "INFO"
      if match(message, r'^\S+ (ERR|FTL|PNC) ') {
        severity = "ERROR"
      } else if match(message, r'^\S+ WRN ') {
        severity = "WARNING"
      } else if match(message, r'^\S+ (INF|DBG) ') {
        severity = "INFO"
      } else if match(message, r'\b(?i:error|fatal|panic|uncaught|failed|failure|could not)\b|\w+Error\b|✗|失敗|エラー') {
        severity = "ERROR"
      } else if match(message, r'\b(?i:warn|warning)\b|⚠') {
        severity = "WARNING"
      }
      . = {
        "timestamp": .timestamp,
        "service": parts[-2],
        "file": parts[-1],
        "message": message,
        "severity": severity,
      }

  heartbeat_entries:
    type: remap
    inputs: [heartbeat]
    source: |
      severity = "ERROR"
      if .status == "ok" { severity = "INFO" }
      . = compact({
        "timestamp": .timestamp,
        "service": .service,
        "status": .status,
        "problems": .problems,
        "severity": severity,
      })

sinks:
  # ログ名はサービスごと（processing-mac-scribe-bot / -launch-video-gen / -marunage-studio）。
  # Vector はイベントの値だけでできたログ名を受け付けないので、固定の接頭辞を付ける。
  service_logs_to_gcp:
    type: gcp_stackdriver_logs
    inputs: [service_entries]
    project_id: automatic-recording-of-minutes
    credentials_path: "${PROCESSING_MAC_LOGS_HOME}/gcp-credentials.json"
    log_id: "processing-mac-{{ service }}"
    severity_key: severity
    resource:
      type: generic_node
      location: asia-northeast1
      namespace: processing-mac
      node_id: "${PROCESSING_MAC_NAME}"
    # 届いたことを確かめてから読んだ位置を記録する（再起動しても取りこぼさない）。
    acknowledgements:
      enabled: true

  # 停止通知はこのログ名を数える（infra/processing-mac-logs.tf の processing_mac_heartbeat）。
  heartbeat_to_gcp:
    type: gcp_stackdriver_logs
    inputs: [heartbeat_entries]
    project_id: automatic-recording-of-minutes
    credentials_path: "${PROCESSING_MAC_LOGS_HOME}/gcp-credentials.json"
    log_id: processing-mac-heartbeat
    severity_key: severity
    resource:
      type: generic_node
      location: asia-northeast1
      namespace: processing-mac
      node_id: "${PROCESSING_MAC_NAME}"
